# Projects: the single source of truth for tab colours and `wb` workbenches.
#
# Edit this file, then nothing else: bin/projects-gen turns it into the zsh
# cache the shell reads (~/.cache/dotfiles/projects.zsh, regenerated at the
# next shell start when this file is newer) and into the committed fallback
# system/projects.gen (run `projects-gen` and commit both; script/test checks
# they agree).
#
# Private projects (work names, real paths) go in the SOPS-encrypted
# projects.private.sops.yaml instead (secrets pull decrypts it to
# ~/.config/dotfiles/projects.private.yaml); same format, read after this file.
#
# Rows are matched in file order, first match wins, so list specific paths
# before general ones (la-casa before pi, cosmic-clock before docker).
#
#   <preset>:
#     short:    3 characters for the tab badge (up to 8 only if needed)
#     emoji:    one emoji
#     name:     display name; the tab group reads "<emoji> <name>"
#     tag:      home | work; omit for every machine
#     globs:    lowercase, matched against the lowercased working directory
#     root:     optional project directory for `wb <preset>`; when omitted, the
#               first directory matching a glob under $PROJECTS/*, $PROJECTS/*/*
#               or ~/* is used
#     template: optional tab roles for `wb`, default [ai, control]
#     palette:  8 "R G B" tab colours (per-tab rotation picks one by shell PID),
#               or `base: "R G B"` to derive 8 around one colour
#
# A repo's .envrc may still `export TABCOLOR_PRESET=<preset>` to override.

cosmic:
  short: COS
  emoji: "🪐"
  name: Cosmic Clock
  tag: home
  globs: ["*/cosmic-clock*"]
  template: [ai, control, run]
  palette: ["100 100 220", "130 80 200", "80 120 210", "160 90 180",
            "70 140 220", "110 70 190", "90 160 200", "140 100 210"]

