# envoy.gsp-merge.toml
# Auto-merge configuration for Envoy CLI Go source files.
# Real source location found: scripts/go_entities/version.go
# (Generated by scripts/build_envoy.sh: EnvoyVersion = "1.0.0", EnvoyVersionCode = <int>)

version = 1
auto = false

[[rule]]
name = "envoy-version-code"
files = ["scripts/go_entities/version.go"]
line = '^\s*EnvoyVersionCode\s*=\s*(?P<value>\d+)\s*$'
type = "counter"
strategy = "max"

[[rule]]
name = "envoy-version"
files = ["scripts/go_entities/version.go"]
line = '^\s*EnvoyVersion\s*=\s*"(?P<value>[0-9A-Za-z.+-]+)"\s*$'
type = "semver"
strategy = "max"
